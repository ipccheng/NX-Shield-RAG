name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install documentation parsers
        run: |
          python -m pip install PyYAML==6.0.3
          npm install --prefix "$RUNNER_TEMP/docs-node" --no-save --package-lock=false mermaid@11.12.0 jsdom@26.1.0
      - name: Test validator
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate handbook
        run: |
          python tools/validate_docs.py
          node tools/validate_mermaid.mjs "$RUNNER_TEMP/docs-node"
          git diff --check
